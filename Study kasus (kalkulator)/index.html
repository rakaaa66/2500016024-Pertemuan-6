<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Sederhana</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator-container">
        <h2>Kalkulator</h2>
    
        <div class="input-group">
            <input type="number" id="angka1" placeholder="Masukkan angka pertama">
            <input type="number" id="angka2" placeholder="Masukkan angka kedua">
        </div>
        
        <div class="button-group">
            <button id="btn-tambah">+</button>
            <button id="btn-kurang">-</button>
            <button id="btn-kali">*</button>
            <button id="btn-bagi">/</button>
        </div>
        
        <div class="result-box">
            <span>Hasil: </span><strong id="hasil">-</strong>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
